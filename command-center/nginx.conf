server {
    listen 80;
    server_name controlcenter.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name controlcenter.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/controlcenter.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/controlcenter.YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Generous timeouts for long AI processing jobs
    client_max_body_size 250M;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    # Serve uploaded media files directly
    location /media/ {
        alias /var/www/controlcenter/media/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass         http://127.0.0.1:5003;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
